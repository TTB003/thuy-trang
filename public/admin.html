<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cổng đăng nhập quản trị Coffee CRM">
  <title>Đăng nhập Admin — Coffee CRM</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", sans-serif; color: #302319; background: #f5f0e9; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 18% 10%, #e9d8c1, transparent 45%), #f5f0e9; }
    main { width: min(460px, 100%); padding: 38px; border: 1px solid #eadfd3; border-radius: 22px; background: #fffdfa; box-shadow: 0 22px 65px #48301b20; }
    .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 30px; }
    .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 15px; color: white; background: #70451f; font-size: 23px; }
    .brand strong { display: block; font-size: 17px; }
    .brand small { color: #826e5d; }
    .eyebrow { margin: 0 0 7px; color: #9b652a; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 27px; }
    .intro { margin: 9px 0 25px; color: #76695e; line-height: 1.55; }
    label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 700; }
    input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #ded2c5; border-radius: 10px; background: white; font: inherit; }
    input:focus { outline: 3px solid #d9b78b88; border-color: #98632d; }
    button { width: 100%; min-height: 46px; margin-top: 17px; border: 0; border-radius: 10px; font: inherit; font-weight: 750; cursor: pointer; }
    .primary { color: white; background: #70451f; }
    .primary:hover { background: #583719; }
    .quick { color: #69431f; background: #f3e8d8; }
    .quick:hover { background: #ead9c3; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { margin: 14px 0 0; padding: 11px 12px; border-radius: 9px; color: #8b3028; background: #fff0ed; font-size: 13px; line-height: 1.5; }
    #message:empty { display: none; }
    .back { display: block; margin-top: 23px; color: #795c42; text-align: center; text-decoration: none; font-size: 13px; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 520px) { main { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">☕</span><div><strong>Coffee CRM</strong><small>Cổng quản trị hệ thống</small></div></div>
    <p class="eyebrow">Admin portal</p>
    <h1>Đăng nhập quản trị</h1>
    <p class="intro">Cổng này dành riêng cho tài khoản Admin. Quản lý, nhân viên và khách hàng đăng nhập tại trang chính.</p>
    <form id="login-form" autocomplete="on">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="message" role="alert" aria-live="polite"></p>
      <button class="primary" id="login-button" type="submit">Đăng nhập Admin</button>
      <button class="quick" id="quick-fill" type="button">Điền nhanh tài khoản demo Admin</button>
    </form>
    <a class="back" href="/">← Quay lại trang đăng nhập chính</a>
  </main>
  <script src="/mobile-config.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const message = document.getElementById('message');
    const loginButton = document.getElementById('login-button');

    document.getElementById('quick-fill').addEventListener('click', () => {
      username.value = 'admin';
      password.value = 'Admin@123';
      message.textContent = '';
      password.focus();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      loginButton.disabled = true;
      loginButton.textContent = 'Đang xác thực…';
      try {
        const apiBase = String(window.COFFEE_CRM_API_URL || '').replace(/\/$/, '');
        const response = await fetch(`${apiBase}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...(apiBase ? { 'ngrok-skip-browser-warning': 'true' } : {}) },
          credentials: apiBase ? 'omit' : 'same-origin',
          body: JSON.stringify({ tenDangNhap: username.value.trim(), matKhau: password.value }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Không đăng nhập được.');
        if (apiBase) localStorage.setItem('coffee_crm_mobile_token', result.data.token);
        window.location.replace(apiBase ? '/?portal=admin' : '/admin/panel');
      } catch (error) {
        message.textContent = error.message || 'Không kết nối được máy chủ.';
        loginButton.disabled = false;
        loginButton.textContent = 'Đăng nhập Admin';
      }
    });

    const apiBase = String(window.COFFEE_CRM_API_URL || '').replace(/\/$/, '');
    const storedToken = apiBase ? localStorage.getItem('coffee_crm_mobile_token') : null;
    fetch(`${apiBase}/api/auth/me`, {
      credentials: apiBase ? 'omit' : 'same-origin',
      headers: {
        ...(storedToken ? { Authorization: `Bearer ${storedToken}` } : {}),
        ...(apiBase ? { 'ngrok-skip-browser-warning': 'true' } : {}),
      },
    })
      .then((response) => response.ok ? response.json() : null)
      .then((result) => {
        if (result?.data?.vaiTro === 'Admin') window.location.replace(apiBase ? '/?portal=admin' : '/admin/panel');
      })
      .catch(() => {});
  </script>
</body>
</html>
